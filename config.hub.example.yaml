# Minimal hub configuration for t3code-proxy.
#
# Copy to config.yaml and replace the two placeholder values (the installers
# do this for you with freshly generated values). Every other option is
# documented in config.example.yaml.
config-version: 8

server:
  # Listen on loopback only. Tailscale Serve publishes the port to your tailnet:
  #   tailscale serve --bg --https=8317 http://127.0.0.1:8317
  host: "127.0.0.1"
  port: 8317
  # Tailscale Serve connects from loopback, so trust forwarded headers from it.
  trusted-proxies: ["127.0.0.1", "::1"]

management:
  # Allow the web panel over Tailscale. The secret below is still required.
  allow-remote: true
  # Management panel password. Leave empty to disable the panel and its API.
  secret-key: "replace-me"

access:
  # Keys your clients (Claude Code, Codex, ...) send to this hub.
  api-keys:
    - "replace-with-a-54-char-url-safe-key"

routing:
  # Prefer the account whose quota window resets soonest, so no quota is wasted.
  strategy: "soonest-reset-first"
  # Keep a conversation on the same account to preserve prompt caching.
  session-affinity: true
  session-affinity-ttl: "1h"
  retry:
    request-retry: 3
    max-retry-interval: 30

# Record Claude and Codex quota usage over time for the dashboard.
quota-history:
  enabled: true
  interval: 10m
  retention: 35d

observability:
  logs:
    # Keep application logs and full proxy request/response logs, including
    # upstream reasoning events and errors. Never automatically delete them.
    logging-to-file: true
    request-log: true
    logs-max-total-size-mb: 0
    error-logs-max-files: 0
  usage:
    usage-statistics-enabled: true
