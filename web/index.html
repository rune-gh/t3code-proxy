    <title>t3code-proxy</title>
    <script>
      // Apply the stored theme before first paint (see src/stores/useThemeStore.ts).
      (function () {
        var theme = 'auto';
        try {
          var stored = JSON.parse(localStorage.getItem('cli-proxy-theme') || 'null');
          if (stored && stored.state && stored.state.theme) theme = stored.state.theme;
        } catch (e) {}
        if (theme === 'white') theme = 'light';
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
