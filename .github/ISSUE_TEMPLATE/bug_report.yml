name: Bug report
description: Something in t3code-proxy does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove API keys, management secrets, OAuth tokens, and account emails from everything you paste.
        Security problems go through the private process in SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, client settings, or a curl request that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The first line printed when t3code-proxy starts.
      placeholder: "Version: 0.1.0, Commit: abcd1234, BuiltAt: ..."
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - install.sh (Linux)
        - install.sh (macOS)
        - install.ps1 (Windows)
        - Docker / Compose
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      multiple: true
      options:
        - Claude Code
        - Codex
        - Web panel
        - Other OpenAI-compatible client
        - Other Claude-compatible client
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Output of `t3code-proxy doctor` on the hub, if available.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Hub logs around the failure, with secrets removed.
      render: text
